name: Apply

permissions:
  contents: read
  id-token: write
  pull-requests: write

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: terraform fmt
        uses: dflook/terraform-fmt-check@v3

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint \
            --format compact \
            --recursive \
            --config "$(pwd)/.tflint.hcl"

  config-matrix:
    name: Config matrix
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - id: set-matrix
        name: Determine config matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: scripts/detect-changed-configs.sh
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs:
      - config-matrix
      - format
      - lint
    if: ${{ github.event.pull_request.merged == true && needs.config-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.config-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: configs/${{ matrix.config }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: post apply comment (started)
        continue-on-error: true
        uses: ./.github/actions/post-terraform-comment
        with:
          command: apply
          config: ${{ matrix.config }}
          pr-number: ${{ github.event.pull_request.number }}
          steps-json: '[{"name":"init","outcome":"pending"},{"name":"apply","outcome":"pending"}]'
      - uses: ./.github/actions/setup
        with:
          config: ${{ matrix.config }}
          aws-role-arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
          ssh-private-key: ${{ secrets.TF_MODULES_PRIVATE_SSH_KEY }}
      - name: init
        id: init
        run: terraform init -no-color 2>&1 | tee /tmp/${{ github.run_id }}.init.txt
      - name: post apply comment (after init)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/post-terraform-comment
        env:
          STEP_INIT_OUTCOME: ${{ steps.init.outcome }}
        with:
          command: apply
          config: ${{ matrix.config }}
          pr-number: ${{ github.event.pull_request.number }}
          steps-json: '[{"name":"init"},{"name":"apply","outcome":"pending"}]'
      - name: apply
        id: apply
        run: |
          aws s3 cp \
            s3://backstage-terraform-plan-outputs/${{ github.event.pull_request.number }}/${{ matrix.config }}.out \
            plan.out \
            --profile backstage
          terraform apply -no-color plan.out 2>&1  | tee /tmp/${{ github.run_id }}.apply.txt
      - name: clean up plan output
        if: always()
        run: |
          aws s3 rm \
            s3://backstage-terraform-plan-outputs/${{ github.event.pull_request.number }}/${{ matrix.config }}.out \
            --profile backstage
      - name: post apply comment (final)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/post-terraform-comment
        env:
          STEP_INIT_OUTCOME: ${{ steps.init.outcome }}
          STEP_APPLY_OUTCOME: ${{ steps.apply.outcome }}
        with:
          command: apply
          config: ${{ matrix.config }}
          pr-number: ${{ github.event.pull_request.number }}
          steps-json: '[{"name":"init"},{"name":"apply"}]'
